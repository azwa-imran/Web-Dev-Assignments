<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="Q4_postRequests.css">
</head>
<body>
    <h1>Post Manager</h1>
    <h2>Create Announcement</h2>
    <form id="postForm">
        <label>Title:</label>
        <input type="text" id="title" required>
        <label>Content:</label>
        <textarea id="content" required></textarea>
        <label>User ID:</label>
        <input type="number" id="userId" required>
        <button type="submit">Create Post</button>
    </form>
    <h2>Update and Delete Post</h2>
    <button onclick="updatePost()">PUT Request</button>
    <button onclick="patchPost()">PATCH Request</button>
    <button onclick="deletePost()">DELETE Request</button>
    <h2>API Response</h2>
    <div id="result">
        Response will appear here.
    </div>
    <script src="Q4_postRequests.js"></script>
</body>
</html>
